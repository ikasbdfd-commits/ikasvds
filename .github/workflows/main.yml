name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

    # 1️⃣ Enable RDP
    - name: Enable RDP
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
          -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    # 2️⃣ Create RDP User (NO INTERACTIVE ERROR)
    - name: Create RDP User
      shell: powershell
      run: |
        $username = "rdpuser"
        $password = -join ((65..90)+(97..122)+(48..57) | Get-Random -Count 12 | ForEach-Object {[char]$_})

        net user $username $password /add /y
        net localgroup administrators $username /add

        echo "USERNAME=$username" >> $env:GITHUB_ENV
        echo "PASSWORD=$password" >> $env:GITHUB_ENV

    # 3️⃣ Install Tailscale
    - name: Install Tailscale
      shell: powershell
      run: |
        curl.exe -L -o tailscale.exe https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe
        Start-Process -Wait -FilePath .\tailscale.exe -ArgumentList "/quiet"
        Start-Sleep -Seconds 5
        Start-Service Tailscale

    # 4️⃣ Authenticate
    - name: Authenticate Tailscale
      shell: powershell
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        $ts = "C:\Program Files\Tailscale\tailscale.exe"
        & $ts up --authkey=$env:TAILSCALE_AUTHKEY --accept-routes

    # 5️⃣ Get IP
    - name: Get Tailscale IP
      shell: powershell
      run: |
        $ts = "C:\Program Files\Tailscale\tailscale.exe"
        $ip = & $ts ip -4
        echo "TSIP=$ip" >> $env:GITHUB_ENV

    # 6️⃣ Print All Connection Info Clearly
    - name: Show Connection Info
      shell: powershell
      run: |
        Write-Output "======================================"
        Write-Output "RDP READY"
        Write-Output "IP: $env:TSIP"
        Write-Output "USERNAME: $env:USERNAME"
        Write-Output "PASSWORD: $env:PASSWORD"
        Write-Output "PORT: 3389"
        Write-Output "======================================"

    # 7️⃣ Keep Runner Alive
    - name: Keep Alive
      shell: powershell
      run: |
        while ($true) { Start-Sleep -Seconds 300 }