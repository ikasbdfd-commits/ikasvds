name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

    - name: Enable RDP
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
          -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Download & Install Tailscale
      shell: powershell
      run: |
        curl.exe -L -o tailscale.exe https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe
        Start-Process -Wait -FilePath .\tailscale.exe -ArgumentList "/quiet"

    - name: Authenticate Tailscale
      shell: powershell
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        tailscale up --authkey=$env:TAILSCALE_AUTHKEY --accept-routes

    - name: Show Tailscale IP
      shell: powershell
      run: |
        tailscale ip -4

    - name: Keep Alive
      shell: powershell
      run: |
        while ($true) { Start-Sleep -Seconds 300 }