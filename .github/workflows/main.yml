name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

    - name: Enable RDP in Registry & Firewall
      shell: powershell
      run: |
        Write-Output "Enabling RDP..."
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Download and Install Tailscale
      shell: powershell
      run: |
        $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
        Write-Output "Downloading Tailscale..."
        curl.exe -L -o tailscale-setup.exe $url
        Start-Process -Wait -FilePath .\tailscale-setup.exe -ArgumentList "/quiet"

    - name: Start Tailscale Service
      shell: powershell
      run: |
        Write-Output "Starting Tailscale..."
        tailscaled &

    - name: Authenticate to Tailscale
      shell: powershell
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        Write-Output "Authenticating to Tailscale..."
        tailscale up --authkey=$env:TAILSCALE_AUTHKEY --accept-routes

    - name: Show Tailscale Status
      shell: powershell
      run: |
        Write-Output "Tailscale status:"
        tailscale status

    - name: Keep Alive (Block)
      shell: powershell
      run: |
        Write-Output "Tailscale RDP tunnel running..."
        while ($true) { Start-Sleep -Seconds 300 }