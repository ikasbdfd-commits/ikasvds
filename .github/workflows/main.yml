name: Windows RDP Ngrok İkasVDS

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Random Password
      run: |
        $pass = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 12 | ForEach-Object {[char]$_})
        net user runneradmin $pass
        echo "PASSWORD=$pass" >> $env:GITHUB_ENV

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Set Dark Mode
      run: |
        reg add HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize /v AppsUseLightTheme /t REG_DWORD /d 0 /f
        reg add HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize /v SystemUsesLightTheme /t REG_DWORD /d 0 /f

    - name: Apply Wallpaper
      run: |
        $source = "$env:GITHUB_WORKSPACE\ikadvds.png"
        $dest = "$env:USERPROFILE\ikadvds.png"

        if (Test-Path $source) {
            Copy-Item $source $dest -Force
            reg add "HKCU\Control Panel\Desktop" /v Wallpaper /t REG_SZ /d $dest /f
            RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters
            Write-Host "Wallpaper applied."
        } else {
            Write-Host "Wallpaper file NOT found!"
        }

    - name: Install Ngrok
      run: |
        choco install ngrok -y

    - name: Configure Ngrok
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Start Ngrok Tunnel
      run: |
        Start-Process -NoNewWindow -FilePath "ngrok.exe" -ArgumentList "tcp 3389"

    - name: Get Ngrok TCP Address
      run: |
        Start-Sleep -Seconds 10
        $resp = Invoke-RestMethod http://127.0.0.1:4040/api/tunnels
        $tcp = $resp.tunnels | Where-Object { $_.proto -eq "tcp" }
        $publicUrl = $tcp.public_url -replace "tcp://", ""

        Write-Host "=================================="
        Write-Host "RDP Address: $publicUrl"
        Write-Host "Username: runneradmin"
        Write-Host "Password: $env:PASSWORD"
        Write-Host "=================================="

        Start-Sleep -Seconds 21600
