name: Windows RDP Pinggy

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:

    - name: Enable RDP
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Generate Strong Password
      shell: powershell
      run: |
        $password = -join ((33..126) | Get-Random -Count 24 | ForEach-Object {[char]$_})
        net user runneradmin $password
        Write-Output "================================="
        Write-Output "RDP USER: runneradmin"
        Write-Output "RDP PASSWORD: $password"
        Write-Output "================================="

    - name: Start Pinggy TCP Tunnel
      shell: powershell
      run: |
        cmd /c "echo yes | ssh -tt -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 443 -R0:localhost:3389 qr@free.pinggy.io"