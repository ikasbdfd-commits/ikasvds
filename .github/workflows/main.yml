name: Windows RDP JPRQ

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

    - name: Enable RDP
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Generate Strong Password
      shell: powershell
      run: |
        $password = -join ((33..126) | Get-Random -Count 24 | ForEach-Object {[char]$_})
        net user runneradmin $password
        Write-Output "==============================="
        Write-Output "RDP USER: runneradmin"
        Write-Output "RDP PASSWORD: $password"
        Write-Output "==============================="

    - name: Download JPRQ
      shell: powershell
      run: |
        Invoke-WebRequest https://jprq.io/downloads/jprq-windows-amd64.exe -OutFile jprq.exe

    - name: Authenticate JPRQ
      shell: powershell
      env:
        JPRQ_TOKEN: ${{ secrets.JPRQ_TOKEN }}
      run: |
        .\jprq.exe auth $env:JPRQ_TOKEN

    - name: Start TCP Tunnel (Keeps Job Alive)
      shell: powershell
      run: |
        .\jprq.exe tcp 3389
